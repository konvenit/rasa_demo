flows:
  change_validity_date:
    name: Tender Validity Date Change
    description: Change the validity date and handle related tasks
  
    steps:
      - action: action_fetch_tender_details
        next: 
          - if: "slots.validity_expired"
            then:
              - action: utter_give_information
                id: give_information
                next: suggest_validity_date
          - else:
              - action: utter_tender_notexpired
                next: END
      - action: utter_suggest_validity_date
        id: suggest_validity_date
        next: hotels_list
      - action: action_list_hotels
        id: hotels_list
      - collect: date_confirmation
        ask_before_filling: true
        next: 
          - if: "slots.date_confirmation"   # Correct predicate
            then:
              
              - action: utter_suggest_hotel_selection
                id: suggest_hotel_selection
                next: collect_hotels
          - else:
              - collect: new_date
                ask_before_filling: true
                next: sug_hotel_selection

      - action: utter_suggest_hotel_selection
        id: sug_hotel_selection
        next: collect_hotels
      - action: action_collect_selected_hotels
        id: collect_hotels
        next: confirm_extension
      - action: utter_confirm_validity_extension
        id: confirm_extension
      - collect: final_confirmation
        ask_before_filling: true
        next:
          - if: "slots.final_confirmation == true"  # Correct predicate
            then:
              - action: action_update_validity_extension
                id: action_update_validity_extension
                next: display_success
          - else:
              - action: utter_extension_cancelled
                next: END
      
      - action: utter_extension_success
        id: display_success
        next: END